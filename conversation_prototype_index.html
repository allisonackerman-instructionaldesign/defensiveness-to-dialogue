<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Conversation You've Been Avoiding — Interactive Course</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#20354a;background:#eae5db}*{box-sizing:border-box}body{margin:0}.shell{max-width:950px;margin:30px auto;background:#fffdf8;border-radius:16px;overflow:hidden;box-shadow:0 15px 45px #20354a25}header{background:#20354a;color:white;padding:22px 32px;display:flex;justify-content:space-between;gap:15px;align-items:center}header small{color:#eae5db}.progress{height:6px;background:#ddd}.bar{height:100%;background:#b87854;transition:width .3s}main{padding:40px;min-height:510px}h1{font-size:32px;margin:10px 0}h2{font-size:25px;margin:8px 0 20px}p{line-height:1.65} .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#986344;font-weight:bold}.quote{border-left:4px solid #b87854;background:#f5f0e9;padding:18px 24px;margin:20px 0;line-height:1.6}.options{display:grid;gap:12px;margin-top:22px}.option{background:white;border:2px solid #d8d6d2;border-radius:10px;text-align:left;padding:16px 18px;cursor:pointer;color:#20354a;font-size:15px;line-height:1.5}.option:hover,.option:focus{border-color:#b87854;outline:2px solid transparent}.option.selected{border-color:#b87854;background:#fff6ed}.feedback{margin-top:18px;padding:20px;background:#eef2f0;border-radius:10px;line-height:1.6}.feedback strong{display:block;margin-bottom:6px}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:32px}button.nav{border:0;background:#20354a;color:white;padding:12px 22px;border-radius:7px;cursor:pointer;font-weight:bold}button.nav.secondary{background:#eae5db;color:#20354a}button.nav:disabled{opacity:.35;cursor:not-allowed}.framework{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.step{background:#f5f0e9;border-radius:10px;padding:18px}.step b{display:block;margin-bottom:6px}.note{font-size:13px;color:#5d6770}footer{padding:15px 32px;background:#f5f0e9;font-size:12px;color:#5d6770}@media(max-width:600px){.shell{margin:0;border-radius:0}main{padding:24px;min-height:75vh}header{padding:18px 24px}h1{font-size:27px}.framework{grid-template-columns:1fr}}.field{display:block;margin:17px 0;font-weight:bold}.field textarea{display:block;width:100%;min-height:75px;margin-top:8px;padding:12px;border:1px solid #a8b0b5;border-radius:8px;font:inherit;color:#20354a}.field textarea:focus{outline:3px solid #b87854}.result{padding:16px;border:1px solid #d8d6d2;border-radius:10px;margin-top:14px}.status{font-size:13px;color:#52616c}.option:focus-visible,.nav:focus-visible{outline:3px solid #b87854;outline-offset:2px}.completion{background:#eef2f0;border-radius:10px;padding:18px;margin:20px 0}@media(prefers-reduced-motion:reduce){.bar{transition:none}}</style></head><body><div class="shell"><header><div><strong>The Conversation You've Been Avoiding</strong><br><small>Turning Defensiveness into Dialogue</small></div><small id="counter">01 / 10</small></header><div class="progress"><div class="bar" id="bar"></div></div><main id="main" aria-live="polite"></main><footer>Instructional design portfolio prototype · Complete interactive course · Fictional workplace scenario · Estimated 15 minutes</footer></div><script>
let page=0;const picks={};const visited={};let submitted=false;let attempts=0;const plan={};
const pages=[
{tag:'01 · REFLECT',title:'The conversation you’ve been avoiding',body:`<p>There’s a conversation you’ve been putting off.</p><p>Maybe a coworker interrupts during meetings. Maybe feedback has led to an uncomfortable reaction. You want to address the concern, but you also want to preserve the relationship.</p><h3>What makes these conversations difficult for you?</h3><p class="note"><strong>Click through each concern</strong> to read the consideration for each one.</p>`,options:[['conflict','I’m worried the conversation will turn into conflict.','Conflict can feel uncomfortable, particularly when the outcome is uncertain.'],['words','I don’t know how to say what I need to say.','Finding the right words is difficult when the conversation matters.'],['reaction','I’m concerned about how the other person will react.','You can’t control someone else’s reaction, but you can influence your approach.'],['relationship','I don’t want to damage the working relationship.','Protecting the relationship and addressing the concern don’t have to compete.']]},
{tag:'02 · THE SITUATION',title:'Meet Jordan',body:`<p>Jordan is someone you enjoy working with. They bring energy to meetings, come prepared, and often have thoughtful ideas.</p><p>Recently, Jordan has sometimes begun speaking before others finish. You’ve found yourself holding back ideas, and a few colleagues contribute less often.</p><p>You choose to talk privately.</p><div class="quote"><b>You:</b> “Could we talk about something I’ve noticed in our meetings? There have been a few times when I haven’t been able to finish sharing an idea before the conversation moves on.”</div><div class="quote"><b>Jordan:</b> “Really? I thought we were just brainstorming. I didn’t realize anyone felt that way. I guess I’m confused. I thought contributing ideas was supposed to be a good thing.”</div><p><b>Before responding, consider what else might be going on.</b></p>`},
{tag:'03 · PERSPECTIVE',title:'What might be beneath the reaction?',body:`<p>Defensiveness can be a natural response to feeling criticized, surprised, or misunderstood. But we cannot know another person’s intentions simply from their reaction.</p><h3>Which interpretation leaves room for curiosity?</h3>`,options:[['a','Jordan doesn’t care about anyone else’s ideas.','That is an assumption about intention. We don’t have enough evidence to conclude it.'],['b','Jordan may see energetic interruptions as normal brainstorming.','That’s a plausible interpretation—not a certainty. Asking about Jordan’s experience can help you understand.'],['c','Jordan is deliberately avoiding responsibility.','That may be one possibility, but Jordan’s words do not establish it. Separate observation from assumption.']]},
{tag:'04 · TOOLKIT',title:'Four steps to stay grounded',body:`<p>You don’t need a perfect script. You need a way to keep honesty and respect in the same conversation.</p><div class="framework"><div class="step"><b>01 · Prepare</b>Separate observations from assumptions. Know what needs to change.</div><div class="step"><b>02 · Describe</b>Name a specific behavior and explain its impact.</div><div class="step"><b>03 · Listen</b>Acknowledge the response and invite the other perspective.</div><div class="step"><b>04 · Agree</b>Find a realistic next step together.</div></div><p class="note">This is a practical framework developed for this demonstration course, not a validated proprietary model.</p><p><b>Remember:</b> The goal is not to control another person’s reaction. It is to make a productive conversation more possible.</p>`},
{tag:'05 · PRACTICE',title:'What would you say to Jordan?',body:`<div class="quote"><b>Jordan:</b> “I thought contributing ideas was supposed to be a good thing.”</div><p>Choose how you would respond. Each option reveals a different reaction and coaching feedback.</p>`,options:[['a','“Contributing is great, but you need to stop interrupting people.”','Jordan: “I don’t think I’m the only one who interrupts. Why are you singling me out?”|You have named the concern, but the abrupt wording may make Jordan feel singled out. Try acknowledging the positive intention and describing the impact.'],['b','“It is a good thing. Don’t worry about it. It’s probably not worth discussing.”','Jordan: “Okay, good. I was starting to think I’d done something wrong.”|Reassurance may reduce discomfort now, but the concern remains unresolved. You can affirm Jordan and still discuss the impact.'],['c','“Your ideas add a lot. I’ve also noticed that sometimes people don’t get to finish. Could we find a way to make room for both?”','Jordan: “I honestly hadn’t realized I was doing that. I thought we were all jumping in.”|You acknowledge Jordan’s contribution while describing a concrete concern. This opens the door to understanding and a collaborative next step.']]},
{tag:'06 · PRACTICE',title:'When feedback feels personal',body:`<p>As the conversation continues, Jordan becomes quieter.</p><div class="quote"><b>Jordan:</b> “I’ve worked really hard to contribute more in meetings. My last supervisor told me I needed to speak up. Now it sounds like I’m doing that wrong, too.”</div><p>You’ve learned something you didn’t know. What would you say next?</p>`,options:[['a','“You’re taking this too personally. I’m just asking you not to interrupt.”','Jordan: “Okay. I’ll try not to.”|The request is understandable, but telling Jordan how to feel may close off the discussion. Agreement in the moment does not necessarily mean the concern is resolved.'],['b','“That sounds frustrating. I didn’t know you’d been encouraged to speak up. Could we talk about how to make room for your ideas and everyone else’s?”','Jordan: “Yes. Sometimes I jump in because I’m afraid I’ll forget my thought.”|You acknowledge Jordan’s experience while keeping the original concern in view. Now you have useful information for a practical solution.'],['c','“I’m sorry. I shouldn’t have said anything. You’ve clearly been trying.”','Jordan: “Thanks. I appreciate that.”|Your empathy is genuine, but withdrawing the concern leaves the pattern unaddressed. You can be compassionate without abandoning the conversation.']]},
{tag:'07 · PRACTICE',title:'Finding a way forward',body:`<p>After you listen and clarify your concern, Jordan offers an explanation.</p><div class="quote"><b>Jordan:</b> “I think I jump in because I’m afraid I’ll forget what I wanted to say. I don’t mean to interrupt anyone.”</div><p>How can you work toward a solution that respects both perspectives?</p>`,options:[['a','“From now on, you need to wait until everyone is finished before you say anything.”','Jordan: “I can try, but I’m not sure I’ll remember everything I wanted to contribute.”|The expectation is clear, but the approach leaves little room to solve the challenge Jordan identified.'],['b','“That makes sense. Let’s both just try to do better.”','Jordan: “Sure, that sounds good.”|This is supportive but vague. Neither person has a clear way to tell whether things have improved.'],['c','“What if we let people finish and jot down ideas we don’t want to forget? We can see how that works at the next meeting.”','Jordan: “I could do that. And if I interrupt without noticing, I’d rather you tell me.”|You’ve proposed a specific, shared action that addresses both the impact and Jordan’s concern.']]},
{tag:'08 · SELF-AWARENESS',title:'What about your own defensiveness?',body:`<p>Later, your supervisor says:</p><div class="quote">“I appreciate you taking initiative with Jordan. I wonder whether you could have approached the conversation differently.”</div><p>Your stomach tightens. Your first thought is, <i>I was trying to help. Why am I being criticized?</i></p><p>Which response gives you the best chance to learn from the feedback?</p>`,options:[['a','“I think I handled it appropriately, and here’s why.”','Explaining your intent might be useful later. Starting with a defense, though, may prevent you from hearing what your supervisor noticed.'],['b','“Okay.” Then avoid the topic.','Silence can buy time to process, but disengaging entirely may mean missing a useful perspective.'],['c','“I want to understand. What might you have done differently?”','You can notice discomfort without letting it make the decision for you. Curiosity gives you space to consider the feedback before deciding whether you agree.']]},
{tag:'09 · APPLY',title:'A new conversation: Morgan',body:`<p>Your coworker Morgan has delivered information after an agreed deadline twice, delaying your weekly report.</p><div class="quote"><b>Morgan:</b> “I know the reports have been late, but I’ve been covering for two other people. It feels like no one notices how much extra work I’m doing.”</div><p>Make three independent decisions. You’ll see your results and coaching feedback after submitting.</p>`},
{tag:'10 · TRANSFER',title:'Your next conversation',body:`<p>Think about a conversation you may need to have. Prepare without including confidential information or identifying details about colleagues.</p><p>Defensiveness is human. Responding constructively is a skill we can learn.</p>`}
];
const questions=[
{q:'What is the most reasonable interpretation of Morgan’s response?',opts:['Morgan is trying to manipulate you.','Morgan may feel overwhelmed and unrecognized.','Morgan doesn’t care about deadlines.'],correct:1,why:'Morgan’s words suggest workload pressure and a desire to be recognized. Explore that possibility without assuming you know their motives.'},
{q:'What would you say next?',opts:['Everyone is busy. We still need you to meet the deadline.','I can hear that you’re carrying a lot. Can we look at what is making the handoff difficult and how it affects the report?','You’re right. I won’t bring up the deadlines again.'],correct:1,why:'This acknowledges the workload while keeping the missed handoffs in view. Both concerns deserve attention.'},
{q:'What is the most useful next step?',opts:['Agree Morgan will try harder.','Offer to do Morgan’s work indefinitely.','Agree on the essential information, a realistic handoff time, and a date to review the plan.'],correct:2,why:'A concrete and realistic agreement is more helpful than vague promises or an unsustainable workaround.'}
];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function canContinue(){if(page===0)return Object.keys(visited).length===4;if(page===8)return submitted;if(page===9)return false;return !pages[page].options||Boolean(picks[page])}
function render(){const p=pages[page];document.getElementById('counter').textContent=String(page+1).padStart(2,'0')+' / 10';document.getElementById('bar').style.width=((page+1)/10*100)+'%';let h=`<div class="eyebrow">${p.tag}</div><h1>${p.title}</h1>${p.body}`;
if(p.options){h+='<div class="options">'+p.options.map(o=>`<button type="button" class="option ${picks[page]===o[0]?'selected':''}" onclick="choose('${o[0]}')" aria-pressed="${picks[page]===o[0]}">${o[1]}</button>`).join('')+'</div>';let choice=p.options.find(o=>o[0]===picks[page]);if(choice){let parts=choice[2].split('|');h+=`<div class="feedback" role="status"><strong>${parts.length===2?'What happens next':'Consider this'}</strong>${parts[0]}${parts.length===2?'<hr><strong>Coaching feedback</strong>'+parts[1]:''}</div>`}if(page===0)h+=`<p class="status">Concerns explored: ${Object.keys(visited).length} of 4. Explore all four to continue.</p>`}
if(page===6&&picks[6])h+=`<div class="completion"><b>A constructive conclusion</b><p>Jordan: “If I interrupt without noticing, I’d rather you tell me than let it become a bigger issue.”</p><p>You: “I appreciate that. And I hope you’ll tell me if I make it harder for you to contribute.”</p><p>Progress doesn’t require a perfect conversation or instant agreement.</p></div>`;
if(page===8){questions.forEach((q,i)=>{h+=`<div class="result"><b>${i+1}. ${q.q}</b><div class="options">${q.opts.map((o,j)=>`<button type="button" class="option ${picks['q'+i]===String(j)?'selected':''}" aria-pressed="${picks['q'+i]===String(j)}" ${submitted?'disabled':''} onclick="answer(${i},${j})">${escapeHtml(o)}</button>`).join('')}</div>`;if(submitted)h+=`<div class="feedback"><b>${Number(picks['q'+i])===q.correct?'Effective choice':'Consider another approach'}</b>${q.why}</div>`;h+='</div>'});let answered=questions.every((_,i)=>picks['q'+i]!==undefined);if(!submitted)h+=`<div class="actions"><button class="nav" onclick="submitQuiz()" ${answered?'':'disabled'}>Submit my decisions</button></div>`;else{let score=questions.filter((q,i)=>Number(picks['q'+i])===q.correct).length;h+=`<div class="completion" role="status"><h2>Your result: ${score} / 3</h2><p>${score===3?'You demonstrated the targeted responses across all three decisions.':'Review the coaching feedback, then try again. The mastery target is 3 out of 3.'}</p><button class="nav secondary" onclick="retryQuiz()">Try assessment again</button></div>`}}
if(page===9){const fields=[['observed','1. What did I observe without making assumptions?'],['impact','2. What impact do I need to explain?'],['question','3. What question could help me understand the other perspective?'],['next','4. What specific next step could we agree on?']];h+=fields.map(([id,label])=>`<label class="field" for="${id}">${label}<textarea id="${id}" oninput="savePlan('${id}',this.value)" placeholder="Write a brief, non-identifying note...">${escapeHtml(plan[id]||'')}</textarea></label>`).join('');h+=`<div class="actions"><button class="nav" onclick="downloadPlan()">Download my preparation guide (.txt)</button><button class="nav secondary" onclick="restart()">Restart course</button></div><div class="completion"><h2>Course complete</h2><p>You’ve practiced recognizing defensiveness, separating observations from assumptions, responding with curiosity, and finding collaborative next steps.</p><p><b>Stay curious. Be specific. Listen generously. Move forward together.</b></p></div><p class="note">For ordinary workplace disagreements. Harassment, discrimination, threats, or retaliation may require organizational reporting channels rather than informal resolution.</p>`}
h+=`<div class="actions"><button class="nav secondary" onclick="move(-1)" ${page===0?'disabled':''}>← Back</button>${page<9?`<button class="nav" onclick="move(1)" ${canContinue()?'':'disabled'}>Continue →</button>`:''}</div>`;document.getElementById('main').innerHTML=h}
function choose(v){picks[page]=v;if(page===0)visited[v]=true;render()}
function answer(i,j){if(submitted)return;picks['q'+i]=String(j);render()}
function submitQuiz(){if(questions.every((_,i)=>picks['q'+i]!==undefined)){submitted=true;attempts++;render()}}
function retryQuiz(){submitted=false;questions.forEach((_,i)=>delete picks['q'+i]);render()}
function savePlan(id,value){plan[id]=value}
function downloadPlan(){const t='MY CONVERSATION PREPARATION GUIDE\n\n'+[['observed','What I observed'],['impact','Why it matters'],['question','Question I can ask'],['next','Collaborative next step']].map(([id,label])=>label+':\n'+(plan[id]||'')+'\n').join('\n');const url=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='conversation-preparation-guide.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restart(){page=0;submitted=false;for(const k in picks)delete picks[k];for(const k in visited)delete visited[k];render();window.scrollTo(0,0)}
function move(d){if(d>0&&!canContinue())return;page=Math.max(0,Math.min(9,page+d));render();window.scrollTo(0,0)}render();
</script></body></html>
